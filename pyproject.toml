[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = "Виджет для банковских операций"
authors = ["Ваше Имя <ваша_почта@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pytest-cov = "^7.1.0"
requests = "^2.34.2"
python-dotenv = "^1.2.2"
pandas = "^3.0.3"
openpyxl = "^3.1.5"
pandas-stubs = "~=3.0.3"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.2"
pytest-cov = "^7.1.0"
types-requests = "^2.33.0.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
)/
'''

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "dotenv"
ignore_missing_imports = true